name: Check recipe methods once

# Reads recipes with the service role and fills an empty method if one exists.
# It does not publish anything and it does not run the weekly import.
# Removed as soon as the check has finished.
on:
  push:
    branches: [main]
    paths:
      - ".github/check-methods-once"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-recipe-methods.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
