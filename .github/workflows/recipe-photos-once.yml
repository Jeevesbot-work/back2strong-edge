name: Refresh unpublished recipe photos

# One-shot photo replace. Not the weekly importer. Removed after this run.
on:
  push:
    branches: [main]
    paths:
      - ".github/recipe-photos-once"

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate unpublished draft photos
        run: npx tsx scripts/refresh-draft-photos.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
