name: Cleanup duplicate recipe drafts

# One-shot. Removed as soon as this run is queued. Not the weekly importer.
on:
  push:
    branches: [main]
    paths:
      - ".github/recipe-cleanup-once"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete the accidental drafts and backfill creator photos
        run: npx tsx scripts/cleanup-duplicate-drafts.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
